name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Precisa do mesmo environment onde está CUSTOM_GITHUB_PAGES_DOMAIN — senão `vars.*`
    # do ambiente não existe neste job (só existiam no deploy) e o build usa BASE_PATH errado.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Domínio próprio em Pages = site na raiz (/). Aí não pode usar basePath /nome-do-repo.
      # Variável pode estar em: Repo → Settings → Secrets and variables → Actions → Variables,
      # ou na environment "github-pages" (neste caso o job build também deve usar environment: github-pages).
      - name: Static export
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          FLAG="$(echo "${{ vars.CUSTOM_GITHUB_PAGES_DOMAIN }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$FLAG" = "true" ] || [ "$FLAG" = "1" ] || [ "$FLAG" = "yes" ]; then
            echo "Build para domínio próprio (BASE_PATH vazio — URLs /_next/..., /images/...)"
            npm run build
          else
            export BASE_PATH="/${REPO_NAME}"
            echo "Build para https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
            npm run build
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
