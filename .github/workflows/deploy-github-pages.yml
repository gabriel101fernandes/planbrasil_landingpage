name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Domínio próprio em Pages = site na raiz (/). Aí não pode usar basePath /nome-do-repo.
      # Defina a repository variable CUSTOM_GITHUB_PAGES_DOMAIN=true em:
      # Settings → Secrets and variables → Actions → Variables
      - name: Static export
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          if [ "${{ vars.CUSTOM_GITHUB_PAGES_DOMAIN }}" = "true" ]; then
            echo "Build para domínio próprio (BASE_PATH vazio)"
            npm run build
          else
            export BASE_PATH="/${REPO_NAME}"
            echo "Build para https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
            npm run build
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
